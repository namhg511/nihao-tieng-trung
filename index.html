<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8">
    <title>Từ điển Trung</title>
    <!-- Toàn bộ phần trang trí (màu, bố cục, font) nằm trong style.css -->
    <link rel="stylesheet" href="style.css">
  </head>

  <body>
    <!-- Khung chính: chia 2 cột bằng CSS grid — sidebar bên trái, nội dung bên phải -->
    <div class="ung-dung">

      <!-- ============ SIDEBAR (thanh menu bên trái) ============ -->
      <nav class="sidebar">
        <div class="logo"><span class="chu-han">你好</span> Tiếng Trung</div>

        <!-- data-trang cho biết bấm nút này thì mở trang nào -->
        <button class="muc-menu dang-chon" data-trang="tra-tu">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
          Tra từ
        </button>
        <button class="muc-menu" data-trang="on-tap">
          <svg viewBox="0 0 24 24"><rect x="3" y="6" width="14" height="14" rx="2"/><path d="M7 3h12a2 2 0 0 1 2 2v12"/></svg>
          Ôn tập
        </button>
        <!-- disabled: nút bị khoá, bấm không làm gì -->
        <button class="muc-menu" disabled>
          <svg viewBox="0 0 24 24"><path d="M4 4h12a4 4 0 0 1 4 4v12H8a4 4 0 0 1-4-4z"/><path d="M8 9h8M8 13h6"/></svg>
          Sổ từ <span class="nhan-sap-co">Sắp có</span>
        </button>
        <button class="muc-menu" disabled>
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg>
          Cài đặt <span class="nhan-sap-co">Sắp có</span>
        </button>
      </nav>

      <!-- ============ VÙNG NỘI DUNG (bên phải) ============ -->
      <main class="noi-dung">

        <!-- ----- Trang TRA TỪ ----- -->
        <section id="trang-tra-tu" class="trang trang-tra-tu dang-hien">
          <!-- Ô tìm kiếm có icon kính lúp -->
          <label class="o-tim">
            <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
            <input id="oTim" type="text" placeholder="Gõ chữ Hán hoặc pinyin…" autocomplete="off">
          </label>

          <!-- Chia 2 cột: danh sách kết quả | chi tiết từ đang chọn -->
          <div class="khung-tra">
            <ul id="ketQua" class="the danh-sach"></ul>
            <div id="chiTiet" class="the chi-tiet"></div>
          </div>
        </section>

        <!-- ----- Trang ÔN TẬP (flashcard) ----- -->
        <section id="trang-on-tap" class="trang trang-on-tap">
          <div class="the the-on-tap">
            <div id="chu" class="chu-han chu-flashcard"></div>
            <p id="nghia" class="nghia-flashcard"></p>
            <div class="hang-nut">
              <button id="nutXem" class="nut nut-chinh">Xem nghĩa</button>
            </div>
            <div class="hang-nut">
              <button id="nutTruoc" class="nut">← Từ trước</button>
              <button id="nutNgauNhien" class="nut">Ngẫu nhiên</button>
              <button id="nutTiep" class="nut">Từ tiếp theo →</button>
            </div>
            <p id="dem" class="dem"></p>
          </div>
        </section>

      </main>
    </div>

    <!-- Toàn bộ code JavaScript của giao diện nằm trong renderer.js -->
    <script src="renderer.js"></script>
  </body>
</html>
